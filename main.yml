---
###############################################################################
# 1️⃣ Preparación (localhost)
###############################################################################
- name: "Commvault | Prepare"
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - commvault_prepare


###############################################################################
# 2️⃣ Ejecución tolerante a fallos
###############################################################################
- name: "Commvault | Execute"
  hosts: dynamic_temporal_hosts
  gather_facts: false
  strategy: free
  max_fail_percentage: 100
  ignore_unreachable: true
  roles:
    - commvault_execute
    