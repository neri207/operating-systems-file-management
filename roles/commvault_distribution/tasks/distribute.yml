---
- name: "Distribución del script Commvault"
  hosts: dynamic_temporal_hosts
  gather_facts: false
  strategy: free
  max_fail_percentage: 100
  ignore_unreachable: true

  tasks:

    - block:

        - name: "Ensure destination directory exists"
          ansible.builtin.file:
            path: "{{ remote_dest_dir }}"
            state: directory
            mode: '0755'

        - name: "Copy Commvault script to host"
          ansible.builtin.copy:
            src: "{{ local_tmp_dir }}/{{ file_name }}"
            dest: "{{ remote_dest_dir }}/{{ file_name }}"
            mode: '0755'

      rescue:
        - name: "Marcar fallo de distribución"
          set_fact:
            commvault_status: "ERROR_DISTRIBUCION"

      always:
        - name: "Estado final por host"
          set_fact:
            commvault_status: "{{ commvault_status | default('OK') }}"
