---
# 1. Inicialización de variables (Siempre se ejecuta)
- name: "Inicializar variables de estado"
  ansible.builtin.set_fact:
    file_status: "PENDIENTE"
    host_name_real: "N/A"
    host_ip_real: "{{ inventory_hostname }}"
    detected_os: "Desconocido"

# 2. Intento de conexión y recolección
- name: "Recolección de facts"
  ansible.builtin.setup:
    gather_subset: ['!all', 'min']
  ignore_unreachable: true # ESTA ES LA CLAVE
  ignore_errors: true
  register: setup_result

# 3. Clasificación de estado (Manejo explícito de Unreachable)
- name: "Clasificar estado y OS"
  ansible.builtin.set_fact:
    file_status: >-
      {% if setup_result.unreachable is defined and setup_result.unreachable %}
        No accesible por ssh
      {% elif setup_result.failed is defined and setup_result.failed %}
        OS incompatible o Sin Python
      {% else %}
        {{ file_status }}
      {% endif %}
    detected_os: >-
      {% if setup_result.unreachable is defined and setup_result.unreachable %}
        N/A (Sin conexión)
      {% else %}
        {{ ansible_distribution | default(ansible_system) | default('Incompatible/AIX') }}
      {% endif %}

# 4. Bloque de ejecución (Solo si hay conexión y Python funcional)
- block:
    - name: "Asegurar directorio de destino"
      ansible.builtin.file:
        path: "{{ remote_dest_dir }}"
        state: directory
        mode: '0755'

    - name: "Copiar script de Commvault"
      ansible.builtin.copy:
        src: "/tmp/commvault/{{ file_name }}"
        dest: "{{ remote_dest_dir }}/{{ file_name }}"
        mode: '0755'
      register: copy_task

    - name: "Definir estado EXISTE"
      ansible.builtin.set_fact:
        file_status: "EXISTE"
        host_name_real: "{{ ansible_hostname }}"

  rescue:
    - name: "Detectar si el fallo fue por falta de espacio"
      ansible.builtin.set_fact:
        file_status: "FS lleno"
      when: >
        'No space left on device' in (ansible_failed_result.msg | default('')) or
        'ENOSPC' in (ansible_failed_result.msg | default(''))

  # Solo entra aquí si no hubo error de conexión ni de Python
  when: 
    - setup_result.unreachable is not defined or not setup_result.unreachable
    - setup_result.failed is not defined or not setup_result.failed

# 5. Reporte final (Fuera de cualquier 'when' restrictivo para que incluya a todos)
- name: "Registrar datos en el reporte"
  ansible.builtin.lineinfile:
    path: "/tmp/commvault/report.csv"
    line: "{{ host_ip_real }},{{ host_name_real }},{{ detected_os }},{{ file_status }}"
    insertafter: EOF
  delegate_to: localhost
  throttle: 1