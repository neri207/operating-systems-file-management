---
# Estado por defecto
- name: "Inicializar estado por host"
  ansible.builtin.set_fact:
    file_status: "NO_ACCESIBLE"

# Distribución tolerante a fallos
- block:

    - name: "Ensure destination directory exists"
      ansible.builtin.file:
        path: "{{ remote_dest_dir }}"
        state: directory
        mode: '0755'

    - name: "Copy Commvault script"
      ansible.builtin.copy:
        src: "/tmp/commvault/{{ file_name }}"
        dest: "{{ remote_dest_dir }}/{{ file_name }}"
        mode: '0755'

    - name: Verificar si existe el archivo
      ansible.builtin.stat:
        path: /opt/tivoli/commvault-bkp.sh
      register: commvault_file
      ignore_errors: true

    - name: Definir estado del archivo
      ansible.builtin.set_fact:
        file_status: "{{ 'EXISTE' if commvault_file.stat.exists else 'NO_EXISTE' }}"
      when: commvault_file is defined and commvault_file.stat is defined

  rescue:
    - name: "Marcar fallo de distribución"
      set_fact:
        file_status: "ERROR_DISTRIBUCION"

  ignore_errors: true

# Reporte
- name: "Crear archivo CSV con encabezado"
  ansible.builtin.copy:
    dest: "/tmp/commvault/report.csv"
    content: "IP,Hostname,Archivo\n"
    force: false
  delegate_to: localhost
  run_once: true

# Obtener facts sin romper ejecución
- name: Obtener facts del host (si responde)
  ansible.builtin.setup:
  ignore_errors: true

# Normalizar hostname e IP por host
#- name: Definir hostname e IP del host
#  ansible.builtin.set_fact:
#    host_name_real: "{{ ansible_hostname | default(inventory_hostname) }}"
#    host_ip_real: "{{ ansible_default_ipv4.address | default('N/A') }}"
#  ignore_errors: true

# Normalizar hostname e IP por host
- name: Definir hostname e IP del host
  ansible.builtin.set_fact:
    host_name_real: "{{ ansible_hostname | default('N/A') }}"
    host_ip_real: "{{ inventory_hostname }}"
  ignore_errors: true

# Actualizar reporte centralizado
- name: "Actualizar reporte"
  ansible.builtin.lineinfile:
    path: "/tmp/commvault/report.csv"
    line: >-
      {{ hostvars[inventory_hostname].host_ip_real }},
      {{ hostvars[inventory_hostname].host_name_real }},
      {{ file_status | default('NO_INFO') }}
    insertafter: EOF
  delegate_to: localhost
  delegate_facts: false
  ignore_errors: true

