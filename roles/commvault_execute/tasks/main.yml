---
# 1. Inicializar estados base
- name: "Inicializar variables de estado"
  ansible.builtin.set_fact:
    file_status: "PENDIENTE"
    host_name_real: "N/A"
    host_ip_real: "{{ inventory_hostname }}"

# 2. Intentar recolectar facts con manejo de errores de conexión
- name: "Recolección de facts (Intento de conexión)"
  ansible.builtin.setup:
    gather_subset:
      - 'min'
  ignore_unreachable: true
  ignore_errors: true
  register: setup_result

# 3. Clasificar si el host es inaccesible
- name: "Marcar como No accesible por ssh"
  ansible.builtin.set_fact:
    file_status: "No accesible por ssh"
  when: 
    - setup_result.unreachable is defined and setup_result.unreachable
    - host_name_real == "N/A"

# 4. Actualizar hostname real si la conexión fue exitosa
- name: "Asignar hostname real"
  ansible.builtin.set_fact:
    host_name_real: "{{ ansible_hostname }}"
  when: setup_result.unreachable is not defined or not setup_result.unreachable

# 5. Bloque de ejecución principal (Solo si hay conexión)
- block:
    - name: "Asegurar directorio de destino"
      ansible.builtin.file:
        path: "{{ remote_dest_dir }}"
        state: directory
        mode: '0755'

    - name: "Copiar script de Commvault"
      ansible.builtin.copy:
        src: "/tmp/commvault/{{ file_name }}"
        dest: "{{ remote_dest_dir }}/{{ file_name }}"
        mode: '0755'
      register: copy_task

    - name: "Validar existencia final"
      ansible.builtin.stat:
        path: "{{ remote_dest_dir }}/{{ file_name }}"
      register: final_stat

    - name: "Definir estado EXISTE"
      ansible.builtin.set_fact:
        file_status: "EXISTE"
      when: final_stat.stat.exists

  rescue:
    - name: "Detectar si el fallo fue por falta de espacio"
      ansible.builtin.set_fact:
        file_status: "FS lleno"
      when: >
        'No space left on device' in (ansible_failed_result.msg | default('')) or
        'ENOSPC' in (ansible_failed_result.msg | default(''))

    - name: "Otros errores (Mantener PENDIENTE si no es FS lleno)"
      ansible.builtin.set_fact:
        file_status: "PENDIENTE"
      when: file_status != "FS lleno"

  # Este bloque solo corre si el host NO fue marcado como inaccesible
  when: file_status != "No accesible por ssh"

# 6. Reporte consolidado
- name: "Preparar archivo CSV en localhost"
  ansible.builtin.copy:
    dest: "/tmp/commvault/report.csv"
    content: "IP,Hostname,Estado\n"
    force: false
  delegate_to: localhost
  run_once: true

- name: "Registrar datos en el reporte"
  ansible.builtin.lineinfile:
    path: "/tmp/commvault/report.csv"
    line: "{{ host_ip_real }},{{ host_name_real }},{{ file_status }}"
    insertafter: EOF
  delegate_to: localhost
  throttle: 1 # Evita colisiones de escritura en el archivo