---
# 1. Inicialización ultra-resiliente
- name: "Inicializar variables de estado"
  ansible.builtin.set_fact:
    file_status: "PENDIENTE"
    host_name_real: "N/A"
    host_ip_real: "{{ inventory_hostname }}"
    detected_os: "Desconocido"

# 2. Intento de recolección de facts (Mínimo esfuerzo)
- name: "Recolección de facts (Intento de conexión)"
  ansible.builtin.setup:
    gather_subset: ['!all', 'min']
  ignore_unreachable: true
  ignore_errors: true
  register: setup_result

# 3. Clasificación inteligente de errores de plataforma
- name: "Clasificar estado y OS"
  ansible.builtin.set_fact:
    detected_os: "{{ ansible_distribution | default(ansible_system) | default('Incompatible/AIX') }}"
    file_status: >-
      {% if setup_result.unreachable is defined and setup_result.unreachable %}
        No accesible por ssh
      {% elif setup_result.failed is defined and setup_result.failed %}
        OS incompatible o Sin Python
      {% else %}
        {{ file_status }}
      {% endif %}

# 4. Bloque de ejecución principal (Solo si no hay errores de conexión/OS)
- block:
    - name: "Asegurar directorio de destino"
      ansible.builtin.file:
        path: "{{ remote_dest_dir }}"
        state: directory
        mode: '0755'

    - name: "Copiar script de Commvault"
      ansible.builtin.copy:
        src: "/tmp/commvault/{{ file_name }}"
        dest: "{{ remote_dest_dir }}/{{ file_name }}"
        mode: '0755'
      register: copy_task

    - name: "Definir estado EXISTE"
      ansible.builtin.set_fact:
        file_status: "EXISTE"
        host_name_real: "{{ ansible_hostname }}"

  rescue:
    - name: "Detectar si el fallo fue por falta de espacio"
      ansible.builtin.set_fact:
        file_status: "FS lleno"
      when: >
        'No space left on device' in (ansible_failed_result.msg | default('')) or
        'ENOSPC' in (ansible_failed_result.msg | default(''))

  # Solo intentamos copiar si el setup fue exitoso
  when: setup_result.failed is not defined or not setup_result.failed

# 5. Reporte mejorado con columna de OS
- name: "Preparar archivo CSV en localhost"
  ansible.builtin.copy:
    dest: "/tmp/commvault/report.csv"
    content: "IP,Hostname,Estado\n"
    force: false
  delegate_to: localhost
  run_once: true

- name: "Registrar datos en el reporte"
  ansible.builtin.lineinfile:
    path: "/tmp/commvault/report.csv"
    line: "{{ host_ip_real }},{{ host_name_real }},{{ file_status }}"
    insertafter: EOF
  delegate_to: localhost
  throttle: 1 # Evita colisiones de escritura en el archivo
