---
# 1. Inicialización de variables base
- name: "Inicializar variables de estado"
  ansible.builtin.set_fact:
    file_status: "PENDIENTE"
    host_name_real: "N/A"
    host_ip_real: "{{ inventory_hostname }}"
    detected_os: "Desconocido"

# 2. Validación de seguridad de la ruta dinámica
- name: "Validar que la ruta de destino sea segura"
  ansible.builtin.assert:
    that:
      - "remote_dest_dir not in ['/', '/etc', '/boot', '/root', '/bin', '/sbin']"
      #- "remote_dest_dir not in ['/', '/etc', '/boot', '/bin', '/sbin']"
      - "not remote_dest_dir.startswith('/etc/')"
      - "not remote_dest_dir.startswith('/boot/')"
    fail_msg: "ERROR DE SEGURIDAD: La ruta '{{ remote_dest_dir }}' está prohibida o es del sistema."
    success_msg: "Ruta '{{ remote_dest_dir }}' validada correctamente."
  delegate_to: localhost
  run_once: true

# 3. Intento de conexión y recolección de facts
- name: "Recolección de facts"
  ansible.builtin.setup:
    gather_subset: ['!all', 'min']
  ignore_unreachable: true
  ignore_errors: true
  register: setup_result

# 4 Capturar el Hostname si la conexión fue exitosa
# Esto se ejecuta independientemente de si el copiado posterior falla
- name: "Asignar hostname real si hay conexión"
  ansible.builtin.set_fact:
    host_name_real: "{{ ansible_hostname | default('N/A') }}"
    detected_os: "{{ ansible_distribution | default(ansible_system) | default('AIX/RHEL6') }}"
  when: 
    - setup_result.unreachable is not defined or not setup_result.unreachable
    - setup_result.failed is not defined or not setup_result.failed

# 5. Clasificación de estado de conexión/plataforma
- name: "Clasificar estado inicial"
  ansible.builtin.set_fact:
    file_status: >-
      {% if setup_result.unreachable is defined and setup_result.unreachable %}
        No accesible por ssh
      {% elif setup_result.failed is defined and setup_result.failed %}
        OS incompatible o Sin Python
      {% else %}
        {{ file_status }}
      {% endif %}

# 6. Bloque de ejecución de tareas de archivo
- block:
    - name: "Asegurar directorio de destino"
      ansible.builtin.file:
        path: "{{ remote_dest_dir }}"
        state: directory
        mode: '0755'

    - name: "Copiar script de Commvault"
      ansible.builtin.copy:
        src: "/tmp/{{ gcp_subdirectory }}/{{ gcp_archive }}"
        dest: "{{ remote_dest_dir }}/{{ gcp_archive }}"
        mode: '0755'
      register: copy_task

    - name: "Instalar unzip si no está presente (RedHat/SUSE)"
      block:
        - name: "Verificar si unzip existe"
          ansible.builtin.shell: "command -v unzip"
          register: unzip_check
          ignore_errors: true
          changed_when: false

        - name: "Instalar unzip en RedHat/CentOS/SLES"
          ansible.builtin.package:
            name: unzip
            state: present
          become: true # Requiere privilegios de root
          when: unzip_check.rc != 0
      when: gcp_archive.endswith('.zip')

    - name: "Descomprimir archivo (Solo si es .zip)"
      ansible.builtin.unarchive:
        src: "{{ remote_dest_dir }}/{{ gcp_archive }}" # Ruta del archivo copiado
        dest: "{{ remote_dest_dir }}"                 # Carpeta destino
        remote_src: yes                                # El archivo ya está en el servidor remoto
        mode: '0755'
      register: unarchive_result
      # Esta tarea solo corre si la extensión es .zip
      when: gcp_archive.endswith('.zip')

    - name: "Definir estado EXISTE y DESCOMPRIMIDO"
      ansible.builtin.set_fact:
        file_status: "{{ 'Descomprimido' if (unarchive_result.changed or unarchive_result.skipped is not defined) else 'Existe' }}"

  rescue:
    - name: "Detectar si el fallo fue por falta de espacio"
      ansible.builtin.set_fact:
        file_status: "Filesystem lleno"
      when: >
        'No space left on device' in (ansible_failed_result.msg | default('')) or
        'ENOSPC' in (ansible_failed_result.msg | default('')) or
        'space' in (ansible_failed_result.stderr | default('') | lower)

    - name: "Otros errores de ejecución"
      ansible.builtin.set_fact:
        file_status: "ERROR_EJECUCION"
      when: file_status == "PENDIENTE"

  # Solo intentamos el bloque si el setup funcionó
  when: 
    - setup_result.unreachable is not defined or not setup_result.unreachable
    - setup_result.failed is not defined or not setup_result.failed

# 7. Registro en el reporte (Limpio y sin saltos de línea)
- name: "Registrar datos en el reporte"
  ansible.builtin.lineinfile:
    path: "/tmp/{{ gcp_subdirectory }}/report.csv"
    line: "{{ host_ip_real | trim }},{{ host_name_real | trim }},{{ gcp_archive | trim }},{{ file_status | trim }},{{ remote_dest_dir | trim }}"
    insertafter: EOF
  delegate_to: localhost
  throttle: 1
  ignore_errors: true