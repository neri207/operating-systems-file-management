---
# Estado por defecto
- name: "Inicializar estado por host"
  set_fact:
    file_status: "UNREACHABLE"

# Distribución tolerante a fallos
- block:

    - name: "Ensure destination directory exists"
      ansible.builtin.file:
        path: "{{ remote_dest_dir }}"
        state: directory
        mode: '0755'

    - name: "Copy Commvault script"
      ansible.builtin.copy:
        src: "/tmp/commvault/{{ file_name }}"
        dest: "{{ remote_dest_dir }}/{{ file_name }}"
        mode: '0755'

    - name: "Marcar distribución exitosa"
      set_fact:
        file_status: "EXISTE"

  rescue:
    - name: "Marcar fallo de distribución"
      set_fact:
        file_status: "ERROR_DISTRIBUCION"

  ignore_errors: true

# Reporte
- name: "Crear archivo CSV con encabezado"
  ansible.builtin.copy:
    dest: "/tmp/commvault/report.csv"
    content: "Hostname,IP,Archivo\n"
    force: false
  delegate_to: localhost
  run_once: true

- name: "Actualizar reporte"
  ansible.builtin.lineinfile:
    path: "/tmp/commvault/report.csv"
    line: >-
      {{ ansible_hostname }},
      {{ inventory_hostname | default('N/A') }},
      {{ file_status | default('NO_INFO') }}
    insertafter: EOF
  delegate_to: localhost
  ignore_errors: true

- name: "Upload report to GCP"
  google.cloud.gcp_storage_object:
    action: upload
    bucket: "{{ gcp_bucket }}"
    dest: "reportes/commvault/report.csv"
    src: "/tmp/commvault/report.csv"
    project: "{{ gcp_project }}"
  delegate_to: localhost
  run_once: true
